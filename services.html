<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>TeamPMG &middot; Soporte Informático</title>
  <link rel="icon" type="image/x-icon" href="./img/icons/teampmg_logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Soporte TI">
  <meta name="author" content="Patricio M.">
  <meta rel="canonical" href="https://teampmg.github.io/">

  <!-- Le styles -->
  <link href="./css/bootstrap.css" rel="stylesheet">
  <link href="./css/bootstrap-responsive.css" rel="stylesheet">
  <style>
    body {
      padding-top: 80px;
      /* 60px to make the container go all the way to the bottom of the topbar */
    }



    /* GLOBAL STYLES
    -------------------------------------------------- */
    /* Padding below the footer and lighter body text */

    body {
      background-image: url("./img/bg/wall3k.jpeg");
      background-size: cover;
      background-attachment: fixed;
      background-repeat: no-repeat;
      padding-bottom: 40px;
      color: #161616;
    }


    /* CUSTOMIZE THE NAVBAR
    -------------------------------------------------- */

    /* Special class on .container surrounding .navbar, used for positioning it into place. */
    .navbar-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      margin-top: 0px;
      margin-bottom: -90px;
      /* Negative margin to pull up carousel. 90px is roughly margins and height of navbar. */
    }

    /* Remove border and change up box shadow for more contrast */
    .navbar .navbar-inner {
      border: 0;
      -webkit-box-shadow: 0 2px 10px rgba(0, 0, 0, .25);
      -moz-box-shadow: 0 2px 10px rgba(0, 0, 0, .25);
      box-shadow: 0 2px 10px rgba(0, 0, 0, .25);
    }

    /* Downsize the brand/project name a bit */
    .navbar .brand {
      padding: 14px 20px 16px;
      /* Increase vertical padding to match navbar links */
      font-size: 16px;
      font-weight: bold;
      text-shadow: 0 -1px 0 rgba(0, 0, 0, .5);
    }

    /* Navbar links: increase padding for taller navbar */
    .navbar .nav>li>a {
      padding: 15px 20px;
    }

    /* Offset the responsive button for proper vertical alignment */
    .navbar .btn-navbar {
      margin-top: 10px;
    }
  </style>

</head>

<body>

  <!-- NAVBAR
    ================================================== -->


  <div class="navbar-wrapper">
    <!-- Wrap the .navbar in .container to center it within the absolutely positioned parent. -->
    <div class="container">

      <div class="navbar navbar-inverse">
        <div class="navbar-inner">
          <!-- Responsive Navbar Part 1: Button for triggering responsive navbar (not covered in tutorial). Include responsive CSS to utilize. -->
          <button type="button" class="btn btn-navbar" data-toggle="collapse" data-target=".nav-collapse">
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
          </button>
          <img src="./img/icons/teampmg_logo.png" width="48" class="img pull-left" alt="TeamPMG">
          <a class="brand" href="./index.html">TeamPMG</a>
          <!-- Responsive Navbar Part 2: Place all navbar contents you want collapsed withing .navbar-collapse.collapse. -->
          <div class="nav-collapse collapse">
            <ul class="nav">
              <li><a href="./index.html#a">Inicio</a></li>
              <li><a href="about.html#about">Acerca de</a></li>
              <li class="active"><a href="#service">Servicios</a></li>
              <li><a href="./contact.html#contact">Contacto</a></li>
              </li>
            </ul>
          </div><!--/.nav-collapse -->
        </div><!-- /.navbar-inner -->
      </div><!-- /.navbar -->

    </div> <!-- /.container -->
  </div><!-- /.navbar-wrapper -->

  <div class="container">
    <div class="row-fluid fila-fondo">
      <div class="span3">
        <div class="page-header">
          <h3>Servicios</h3>
        </div>
        <div class="lead">
          <ul>
            <li> <a href="./index.html#a">Hola mundo</a></li>
          </ul>
        </div>
      </div>
      <div class="span9">
        <div class="page-header">
          <h1>Servicios </h1>
          <h2><small>Documento</small></h2>
        </div>
        <div class="pdf-visor">
          <iframe src="docs/servicios-y-valores.pdf" frameborder="0"></iframe>
        </div>
      </div>
    </div>
  </div>



  <!-- FOOTER -->
  <div class="row footer-fondo">
    <div class="container">
      <footer>
        <p id="copyright"><span id="year"></span> &middot; TeamPMG — Soporte Informático</p>
        <p><a target="_blank"
            href="https://docs.github.com/es/site-policy/privacy-policies/github-general-privacy-statement">Privacidad</a>
          &middot; <a target="_blank" href="./docs/tyc.pdf">Terminos</a> &middot; <a target="_blank"
            href="./docs/politica.pdf">Política</a> &middot; <a target="_blank"
            href="./docs/consentimiento.pdf">Consentimiento</a></p>
        </p>
      </footer>
    </div>
  </div><!-- /.container -->



  <!-- Le javascript
    ================================================== -->
  <!-- Placed at the end of the document so the pages load faster -->
  <script src="./js/jquery.js"></script>
  <script src="./js/bootstrap.js"></script>
  <script>
    $(document).ready(function () {
      var year = new Date().getFullYear();
      $('#year').text(year);
    });
  </script>
</body>

</html>
